<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="做宇宙的主人">
<meta name="theme-color" content="#B8A9D9">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js"></script>
<title>✨做宇宙的主人✨</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--l1:#F5F0FA;--l2:#EDE4F7;--l3:#E8DDF2;--l4:#B8A9D9;--l5:#A997CC;--l6:#7C6BA3;--l7:#635688;--l8:#4A406B;--g:#D4B96A;--t1:#4A406B;--t2:#635688;--t3:#8A7EAB;--tm:#A89BC4;--gb:rgba(255,255,255,.55);--gbd:rgba(255,255,255,.7);--gs:0 4px 24px rgba(124,107,163,.12);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sw:88px}
body{font-family:"Noto Sans SC",-apple-system,sans-serif;color:var(--t1);background:linear-gradient(135deg,var(--l1),var(--l2) 50%,var(--l3));background-attachment:fixed;overflow:hidden}
.app{display:flex;height:100dvh}
.sb{width:var(--sw);background:rgba(255,255,255,.4);backdrop-filter:blur(20px);border-right:1px solid var(--gbd);overflow-y:auto;padding-top:var(--st)}
.sb::-webkit-scrollbar{display:none}
.sb-h{padding:18px 10px 14px;text-align:center;border-bottom:1px solid rgba(184,169,217,.2)}
.sb-logo{font-size:28px}
.sb-t{font-size:11px;font-weight:600;color:var(--t2)}
.nl{list-style:none;padding:10px 0}
.ni{display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 6px;margin:3px 8px;border-radius:16px;cursor:pointer;color:var(--t2);position:relative;text-align:center}
.ni.act{background:linear-gradient(135deg,rgba(184,169,217,.35),rgba(212,185,106,.15));color:var(--l6)}
.ni.act:before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:24px;background:linear-gradient(180deg,var(--l4),var(--g));border-radius:0 3px 3px 0}
.ni-i{font-size:20px}.ni-l{font-size:9.5px}
.sb-f{padding:12px 8px;text-align:center;border-top:1px solid rgba(184,169,217,.2);font-size:9px;color:var(--tm);font-style:italic}
.mn{flex:1;overflow-y:auto;padding:calc(var(--st) + 20px) 24px calc(40px + var(--sb))}
.mn::-webkit-scrollbar{width:0}
.pg{display:none}.pg.act{display:block;animation:fi .4s}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.ph{margin-bottom:22px}
.pt{font-size:24px;font-weight:700}.ps{font-size:13px;color:var(--t3)}
.cd{background:var(--gb);backdrop-filter:blur(16px);border:1px solid var(--gbd);border-radius:22px;padding:18px 20px;box-shadow:var(--gs);margin-bottom:16px}
.ct{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.ct .al{width:4px;height:16px;background:linear-gradient(180deg,var(--l4),var(--g));border-radius:2px}
.in,.ta,.se{width:100%;background:rgba(255,255,255,.6);border:1px solid rgba(184,169,217,.3);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--t1);font-family:inherit;outline:none}
.in:focus,.ta:focus,.se:focus{border-color:var(--l4);background:rgba(255,255,255,.85)}
.ta{resize:vertical;min-height:72px;line-height:1.6}
.fg{margin-bottom:14px}.fl{display:block;font-size:12px;font-weight:600;color:var(--t2);margin-bottom:6px}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.bp{background:linear-gradient(135deg,var(--l4),var(--l5));color:#fff;box-shadow:0 3px 12px rgba(169,151,204,.35)}
.bg{background:rgba(184,169,217,.12);color:var(--t2);border:1px solid rgba(184,169,217,.2)}
.bd{background:rgba(220,120,120,.12);color:#C66;border:1px solid rgba(220,120,120,.2)}
.bs{padding:6px 14px;font-size:12px}.bb{width:100%}
.dg{margin-bottom:20px}.dd{font-size:13px;color:var(--t3)}
.dh{font-size:26px;font-weight:700;color:var(--t1)}
.dgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.dgrid .cd{margin-bottom:0}
.sc{text-align:center;padding:18px 12px}.si{font-size:26px;margin-bottom:8px}
.sv{font-size:28px;font-weight:700;color:var(--l6)}.sv .u{font-size:13px;color:var(--t3)}
.sl{font-size:11px;color:var(--t3);margin-top:4px}
.cc{background:linear-gradient(135deg,rgba(184,169,217,.3),rgba(212,185,106,.15));text-align:center;padding:24px 16px}
.cv{font-size:52px;font-weight:800;background:linear-gradient(135deg,var(--l5),var(--g));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin:8px 0}
.cl{font-size:13px;color:var(--t2)}
.ce{font-size:11px;color:var(--tm);margin-top:8px;cursor:pointer;text-decoration:underline}
.pb{height:8px;background:rgba(184,169,217,.2);border-radius:4px;overflow:hidden;margin-top:8px}
.pf{height:100%;background:linear-gradient(90deg,var(--l4),var(--g));border-radius:4px;transition:width .6s}
.qc{text-align:center;padding:22px 20px;background:linear-gradient(135deg,rgba(255,255,255,.6),rgba(235,227,245,.5));position:relative}
.qt{font-size:15px;line-height:1.7;padding:0 12px}.qa{font-size:11px;color:var(--tm);margin-top:10px}
.tl{list-style:none}.ti2{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(184,169,217,.15)}
.ti2:last-child{border-bottom:none}
.tn{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--l4),var(--l5));color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tt2{font-size:14px;flex:1}
.tsm{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px}
.tsi{background:rgba(255,255,255,.5);border-radius:16px;padding:14px;text-align:center}
.tsl{font-size:11px;color:var(--t3)}.tsv{font-size:18px;font-weight:700;color:var(--l6)}
.tk{background:var(--gb);backdrop-filter:blur(16px);border:1px solid var(--gbd);border-radius:16px;padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
.tk.dn{opacity:.6}.tk.dn .tkn{text-decoration:line-through;color:var(--tm)}
 tcb{width:24px;height:24px;border:2px solid var(--l4);border-radius:8px;flex-shrink:0;cursor:pointer;margin-top:2px;display:flex;align-items:center;justify-content:center}
.tcb.ck{background:linear-gradient(135deg,var(--l4),var(--l5));border-color:var(--l5)}
.tcb.ck:after{content:'✓';color:#fff;font-size:14px;font-weight:700}
.tb{flex:1;min-width:0}.tkn{font-size:15px;font-weight:600;margin-bottom:4px}
.tno{font-size:12px;color:var(--t3);margin-bottom:6px}
.tm2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ptg{font-size:10px;padding:2px 8px;border-radius:10px}
.ph2{background:rgba(220,120,120,.15);color:#C66}.pm2{background:rgba(212,185,106,.2);color:#A88B3F}.pl2{background:rgba(184,169,217,.2);color:var(--l5)}
.ci2{background:rgba(255,255,255,.5);border:1px solid rgba(184,169,217,.25);border-radius:16px;overflow:hidden}
.ch{padding:14px 16px;display:flex;justify-content:space-between;cursor:pointer;background:rgba(235,227,245,.3)}
.cn{font-size:15px;font-weight:600}.ctg{font-size:12px;color:var(--t3)}
.cb{padding:0 16px;max-height:0;overflow:hidden;transition:.3s}
.ci2.op .cb{max-height:2000px;padding:16px}
.ci2.op .ctg{transform:rotate(180deg)}
.tl2{position:relative;padding-left:24px}
.tl2:before{content:'';position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:linear-gradient(180deg,var(--l4),var(--g));border-radius:1px}
.tli{position:relative;margin-bottom:18px}
.tli:before{content:'';position:absolute;left:-21px;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--l4);box-shadow:0 0 0 3px rgba(184,169,217,.2)}
.tlt{font-size:12px;color:var(--t3);margin-bottom:4px}
.tlc{background:rgba(255,255,255,.5);border-radius:16px;padding:12px 14px}
.sr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.sm{background:rgba(255,255,255,.5);border-radius:16px;padding:14px 8px;text-align:center}
.smv{font-size:22px;font-weight:700;color:var(--l6)}.sml{font-size:10px;color:var(--t3)}
.rr{display:flex;gap:6px;flex-wrap:wrap}
.rd{width:28px;height:28px;border-radius:50%;border:2px solid var(--l4);background:rgba(255,255,255,.5);cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--t3)}
.rd.act{background:linear-gradient(135deg,var(--l4),var(--l5));border-color:var(--l5);color:#fff;transform:scale(1.1)}
.mb{padding:8px 14px;border-radius:20px;border:1px solid rgba(184,169,217,.3);background:rgba(255,255,255,.5);cursor:pointer;font-size:13px;color:var(--t2)}
.mb.act{background:linear-gradient(135deg,var(--l4),var(--l5));color:#fff}
.iu{border:2px dashed var(--l4);border-radius:16px;padding:16px;text-align:center;color:var(--tm);font-size:12px;cursor:pointer}
.ipl{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ith{position:relative;width:80px;height:80px;border-radius:10px;overflow:hidden}
.ith img{width:100%;height:100%;object-fit:cover}
.ith .ri{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:none;font-size:11px}
.hs{margin-top:20px}.ht{font-size:14px;font-weight:600;color:var(--t2);margin-bottom:12px}
.hi{background:rgba(255,255,255,.4);border-radius:16px;padding:12px 14px;margin-bottom:8px;border-left:3px solid var(--l4)}
.hd{font-size:12px;color:var(--t3);margin-bottom:4px;font-weight:600}
.hc{font-size:13px;line-height:1.6}
.fr{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.fc{padding:6px 14px;border-radius:16px;background:rgba(255,255,255,.5);border:1px solid rgba(184,169,217,.25);font-size:12px;color:var(--t2);cursor:pointer}
.fc.act{background:linear-gradient(135deg,var(--l4),var(--l5));color:#fff}
.ts{position:fixed;bottom:calc(30px + var(--sb));left:50%;transform:translateX(-50%) translateY(100px);background:rgba(74,64,107,.92);color:#fff;padding:12px 24px;border-radius:24px;font-size:13px;z-index:9999;opacity:0;transition:.3s;pointer-events:none}
.ts.sh{transform:translateX(-50%);opacity:1}
.mo{position:fixed;inset:0;background:rgba(74,64,107,.4);backdrop-filter:blur(4px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.mo.sh{display:flex}
.md{background:rgba(255,255,255,.95);border-radius:28px;padding:24px;width:100%;max-width:380px;max-height:80vh;overflow-y:auto}
.mt{font-size:18px;font-weight:700;margin-bottom:16px;text-align:center}
.es{text-align:center;padding:40px 20px;color:var(--tm)}.esi{font-size:40px;margin-bottom:12px;opacity:.5}.est{font-size:13px}
.emoji,img.emoji{display:inline-block!important;width:1.1em!important;height:1.1em!important;vertical-align:-.15em}
@media(max-width:768px){:root{--sw:0}.app{flex-direction:column}.sb{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;flex-direction:row;padding:8px 4px calc(8px + var(--sb));border-right:none;border-top:1px solid var(--gbd);background:rgba(255,255,255,.75);overflow-x:auto}.sb-h,.sb-f{display:none}.nl{display:flex;flex-direction:row;padding:0}.ni{min-width:62px;padding:6px 4px;margin:0 2px}.ni.act:before{display:none}.mn{padding:calc(var(--st) + 16px) 16px 100px}.pt{font-size:21px}.dh{font-size:22px}.dgrid{grid-template-columns:1fr}.cv{font-size:42px}.sv{font-size:24px}}
@media(max-width:380px){.ni{min-width:54px}.ni-i{font-size:16px}.ni-l{font-size:8px}}
</style>
</head>
<body>
<div class="sb-bg" id="starsBg"></div>
<div class="app">
<nav class="sb" id="sidebar"><div class="sb-h"><div class="sb-logo">🌌</div><div class="sb-t">做宇宙的<br>主人</div></div><ul class="nl" id="navList"></ul><div class="sb-f">一点一点<br>成为更好的自己</div></nav>
<main class="mn" id="main"></main>
</div>
<div class="ts" id="toast"></div>
<div class="mo" id="modalOverlay"><div class="md" id="modalContent"></div></div>
<script src="app.js"></script>
<script>window.addEventListener('DOMContentLoaded',function(){if(typeof init==='function')init();})</script>
</body>
</html>
