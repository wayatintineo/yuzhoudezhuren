<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="做宇宙的主人">
<meta name="theme-color" content="#B8A9D9">
<meta name="description" content="陪伴成长的宇宙工作台 - 学习、生活、健康、成长记录">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js" crossorigin="anonymous"></script>
<title>✨做宇宙的主人✨</title>
<style>
:root{
  --lav-50:#F5F1FA;--lav-100:#EBE3F5;--lav-200:#DCD0EE;--lav-300:#C9B8E2;--lav-400:#B8A9D9;
  --lav-500:#A997CC;--lav-600:#9685BD;--lav-700:#7C6BA3;--lav-800:#635688;--lav-900:#4A406B;
  --gold:#D4B96A;--gold-soft:#E8D9A0;--white:#FFFFFF;
  --bg-grad-1:#F5F0FA;--bg-grad-2:#EDE4F7;--bg-grad-3:#E8DDF2;
  --glass-bg:rgba(255,255,255,0.55);--glass-border:rgba(255,255,255,0.7);
  --glass-shadow:0 4px 24px rgba(124,107,163,0.12);
  --glass-shadow-hover:0 6px 32px rgba(124,107,163,0.2);
  --text-1:#4A406B;--text-2:#635688;--text-3:#8A7EAB;--text-muted:#A89BC4;
  --radius-sm:10px;--radius-md:16px;--radius-lg:22px;--radius-xl:28px;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
  --sidebar-w:88px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei","Noto Color Emoji","Apple Color Emoji",sans-serif;color:var(--text-1);background:linear-gradient(135deg,var(--bg-grad-1) 0%,var(--bg-grad-2) 50%,var(--bg-grad-3) 100%);background-attachment:fixed;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;}
.stars-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.star{position:absolute;background:var(--white);border-radius:50%;opacity:0.6;animation:twinkle 4s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:0.2;transform:scale(0.8);}50%{opacity:0.7;transform:scale(1);}}
.moon-deco{position:fixed;top:calc(var(--safe-top) + 12px);right:20px;width:40px;height:40px;z-index:0;pointer-events:none;opacity:0.5;}
.galaxy-deco{position:fixed;bottom:60px;left:-40px;width:120px;height:120px;z-index:0;pointer-events:none;opacity:0.15;background:radial-gradient(ellipse at center,var(--lav-400) 0%,transparent 70%);border-radius:50%;filter:blur(8px);}
.app{position:relative;z-index:1;display:flex;height:100vh;height:100dvh;}
.sidebar{flex-shrink:0;width:var(--sidebar-w);background:rgba(255,255,255,0.4);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-right:1px solid var(--glass-border);display:flex;flex-direction:column;padding-top:var(--safe-top);overflow-y:auto;overflow-x:hidden;scrollbar-width:none;z-index:100;}
.sidebar::-webkit-scrollbar{display:none;}
.sidebar-header{padding:18px 10px 14px;text-align:center;border-bottom:1px solid rgba(184,169,217,0.2);flex-shrink:0;}
.sidebar-logo{font-size:28px;line-height:1;margin-bottom:6px;}
.sidebar-title{font-size:11px;font-weight:600;color:var(--text-2);letter-spacing:0.5px;line-height:1.3;}
.nav-list{list-style:none;padding:10px 0;flex:1;}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:11px 6px;margin:3px 8px;border-radius:var(--radius-md);cursor:pointer;color:var(--text-2);transition:all 0.25s ease;position:relative;text-align:center;}
.nav-item:hover{background:rgba(184,169,217,0.08);}
.nav-item.active{background:linear-gradient(135deg,rgba(184,169,217,0.35),rgba(212,185,106,0.15));color:var(--lav-700);box-shadow:0 2px 10px rgba(184,169,217,0.25);}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:24px;background:linear-gradient(180deg,var(--lav-400),var(--gold));border-radius:0 3px 3px 0;}
.nav-icon{font-size:20px;line-height:1;}
.nav-label{font-size:9.5px;font-weight:500;line-height:1.2;letter-spacing:0.2px;}
.sidebar-footer{padding:12px 8px calc(12px + var(--safe-bottom));text-align:center;flex-shrink:0;border-top:1px solid rgba(184,169,217,0.2);}
.sidebar-quote{font-size:9px;color:var(--text-muted);line-height:1.4;font-style:italic;}
.main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(var(--safe-top) + 20px) 24px calc(40px + var(--safe-bottom));scroll-behavior:smooth;}
.main::-webkit-scrollbar{width:0;}
.page{display:none;animation:fadeIn 0.4s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.page-header{margin-bottom:22px;}
.page-title{font-size:24px;font-weight:700;color:var(--text-1);margin-bottom:4px;letter-spacing:0.5px;}
.page-subtitle{font-size:13px;color:var(--text-3);font-weight:400;}
.card{background:var(--glass-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-border);border-radius:var(--radius-lg);padding:18px 20px;box-shadow:var(--glass-shadow);margin-bottom:16px;transition:box-shadow 0.3s ease;}
.card:hover{box-shadow:var(--glass-shadow-hover);}
.card-title{font-size:15px;font-weight:600;color:var(--text-1);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.card-title .accent-line{width:4px;height:16px;background:linear-gradient(180deg,var(--lav-400),var(--gold));border-radius:2px;}
.input,.textarea,.select{width:100%;background:rgba(255,255,255,0.6);border:1px solid rgba(184,169,217,0.3);border-radius:var(--radius-sm);padding:10px 14px;font-size:14px;color:var(--text-1);font-family:inherit;transition:all 0.2s ease;outline:none;}
.input:focus,.textarea:focus,.select:focus{border-color:var(--lav-400);background:rgba(255,255,255,0.85);box-shadow:0 0 0 3px rgba(184,169,217,0.15);}
.textarea{resize:vertical;min-height:72px;line-height:1.6;}
.input::placeholder,.textarea::placeholder{color:var(--text-muted);}
.field-group{margin-bottom:14px;}
.field-label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px;letter-spacing:0.3px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:all 0.2s ease;letter-spacing:0.3px;}
.btn-primary{background:linear-gradient(135deg,var(--lav-400),var(--lav-500));color:var(--white);box-shadow:0 3px 12px rgba(169,151,204,0.35);}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(169,151,204,0.45);}
.btn-gold{background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:var(--lav-800);box-shadow:0 3px 12px rgba(212,185,106,0.3);}
.btn-ghost{background:rgba(184,169,217,0.12);color:var(--text-2);border:1px solid rgba(184,169,217,0.2);}
.btn-ghost:hover{background:rgba(184,169,217,0.2);}
.btn-danger{background:rgba(220,120,120,0.12);color:#C66;border:1px solid rgba(220,120,120,0.2);}
.btn-sm{padding:6px 14px;font-size:12px;}
.btn-block{width:100%;}
.dash-greeting{margin-bottom:20px;}
.dash-date{font-size:13px;color:var(--text-3);margin-bottom:4px;}
.dash-hello{font-size:26px;font-weight:700;color:var(--text-1);line-height:1.3;}
.dash-hello .sparkle{display:inline-block;animation:sparkle 3s ease-in-out infinite;}
@keyframes sparkle{0%,100%{transform:scale(1) rotate(0deg);}50%{transform:scale(1.15) rotate(10deg);}}
.dash-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.dash-grid .card{margin-bottom:0;}
.stat-card{text-align:center;padding:18px 12px;}
.stat-icon{font-size:26px;margin-bottom:8px;}
.stat-value{font-size:28px;font-weight:700;color:var(--lav-700);line-height:1.1;}
.stat-value .unit{font-size:13px;font-weight:500;color:var(--text-3);margin-left:3px;}
.stat-label{font-size:11px;color:var(--text-3);margin-top:4px;letter-spacing:0.5px;}
.countdown-card{background:linear-gradient(135deg,rgba(184,169,217,0.3),rgba(212,185,106,0.15));text-align:center;padding:24px 16px;}
.countdown-value{font-size:52px;font-weight:800;background:linear-gradient(135deg,var(--lav-600),var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin:8px 0;}
.countdown-label{font-size:13px;color:var(--text-2);}
.countdown-date-edit{font-size:11px;color:var(--text-muted);margin-top:8px;cursor:pointer;text-decoration:underline;text-decoration-color:var(--lav-300);}
.progress-bar{height:8px;background:rgba(184,169,217,0.2);border-radius:4px;overflow:hidden;margin-top:8px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--lav-400),var(--gold));border-radius:4px;transition:width 0.6s cubic-bezier(0.4,0,0.2,1);}
.quote-card{background:linear-gradient(135deg,rgba(255,255,255,0.6),rgba(235,227,245,0.5));text-align:center;padding:22px 20px;position:relative;}
.quote-card::before{content:'"';position:absolute;top:6px;left:14px;font-size:40px;color:var(--lav-300);font-family:Georgia,serif;line-height:1;}
.quote-text{font-size:15px;color:var(--text-1);line-height:1.7;font-weight:500;padding:0 12px;}
.quote-author{font-size:11px;color:var(--text-muted);margin-top:10px;}
.top3-list{list-style:none;}
.top3-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(184,169,217,0.15);}
.top3-item:last-child{border-bottom:none;}
.top3-num{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--lav-300),var(--lav-400));color:var(--white);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.top3-text{font-size:14px;color:var(--text-1);flex:1;}
.task-summary{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px;}
.task-summary-item{background:rgba(255,255,255,0.5);border-radius:var(--radius-md);padding:14px;text-align:center;}
.task-summary-label{font-size:11px;color:var(--text-3);margin-bottom:4px;}
.task-summary-value{font-size:18px;font-weight:700;color:var(--lav-700);}
.task-card{background:var(--glass-bg);backdrop-filter:blur(16px);border:1px solid var(--glass-border);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;transition:all 0.2s ease;}
.task-card.done{opacity:0.6;background:rgba(235,227,245,0.4);}
.task-card.done .task-name{text-decoration:line-through;color:var(--text-muted);}
.task-checkbox{width:24px;height:24px;border:2px solid var(--lav-300);border-radius:8px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s ease;margin-top:2px;}
.task-checkbox.checked{background:linear-gradient(135deg,var(--lav-400),var(--lav-500));border-color:var(--lav-500);}
.task-checkbox.checked::after{content:'✓';color:var(--white);font-size:14px;font-weight:700;}
.task-body{flex:1;min-width:0;}
.task-name{font-size:15px;font-weight:600;color:var(--text-1);margin-bottom:4px;}
.task-note{font-size:12px;color:var(--text-3);margin-bottom:6px;line-height:1.5;}
.task-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.priority-tag{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;}
.priority-high{background:rgba(220,120,120,0.15);color:#C66;}
.priority-mid{background:rgba(212,185,106,0.2);color:#A88B3F;}
.priority-low{background:rgba(184,169,217,0.2);color:var(--lav-600);}
.task-delete{background:none;border:none;color:var(--text-muted);font-size:16px;cursor:pointer;padding:4px;opacity:0.5;transition:opacity 0.2s;}
.task-delete:hover{opacity:1;color:#C66;}
.chapter-list{display:flex;flex-direction:column;gap:12px;}
.chapter-item{background:rgba(255,255,255,0.5);border:1px solid rgba(184,169,217,0.25);border-radius:var(--radius-md);overflow:hidden;}
.chapter-header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;background:rgba(235,227,245,0.3);}
.chapter-name{font-size:15px;font-weight:600;color:var(--text-1);}
.chapter-toggle{font-size:12px;color:var(--text-3);transition:transform 0.2s;}
.chapter-item.open .chapter-toggle{transform:rotate(180deg);}
.chapter-body{padding:0 16px;max-height:0;overflow:hidden;transition:max-height 0.3s ease,padding 0.3s ease;}
.chapter-item.open .chapter-body{max-height:2000px;padding:16px;}
.timeline{position:relative;padding-left:24px;}
.timeline::before{content:'';position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:linear-gradient(180deg,var(--lav-300),var(--gold-soft));border-radius:1px;}
.timeline-item{position:relative;margin-bottom:18px;padding-bottom:4px;}
.timeline-item::before{content:'';position:absolute;left:-21px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--white);border:2px solid var(--lav-400);box-shadow:0 0 0 3px rgba(184,169,217,0.2);}
.timeline-time{font-size:12px;color:var(--text-3);margin-bottom:4px;}
.timeline-content{background:rgba(255,255,255,0.5);border-radius:var(--radius-md);padding:12px 14px;}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.stat-mini{background:rgba(255,255,255,0.5);border-radius:var(--radius-md);padding:14px 8px;text-align:center;}
.stat-mini-value{font-size:22px;font-weight:700;color:var(--lav-700);}
.stat-mini-label{font-size:10px;color:var(--text-3);margin-top:2px;}
.rating-row{display:flex;gap:6px;flex-wrap:wrap;}
.rating-dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--lav-200);background:rgba(255,255,255,0.5);cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:all 0.15s ease;}
.rating-dot.active{background:linear-gradient(135deg,var(--lav-400),var(--lav-500));border-color:var(--lav-500);color:var(--white);transform:scale(1.1);}
.mood-row{display:flex;gap:8px;flex-wrap:wrap;}
.mood-btn{padding:8px 14px;border-radius:20px;border:1px solid rgba(184,169,217,0.3);background:rgba(255,255,255,0.5);cursor:pointer;font-size:13px;color:var(--text-2);transition:all 0.2s ease;}
.mood-btn.active{background:linear-gradient(135deg,var(--lav-300),var(--lav-400));color:var(--white);border-color:var(--lav-400);}
.img-upload-area{border:2px dashed var(--lav-200);border-radius:var(--radius-md);padding:16px;text-align:center;color:var(--text-muted);font-size:12px;cursor:pointer;transition:all 0.2s ease;position:relative;}
.img-upload-area:hover{border-color:var(--lav-400);background:rgba(184,169,217,0.08);}
.img-preview{max-width:100%;max-height:200px;border-radius:var(--radius-sm);margin-top:8px;display:block;}
.img-preview-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.img-thumb{position:relative;width:80px;height:80px;border-radius:var(--radius-sm);overflow:hidden;}
.img-thumb img{width:100%;height:100%;object-fit:cover;}
.img-thumb .remove-img{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,0.5);color:#fff;border:none;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.history-section{margin-top:20px;}
.history-title{font-size:14px;font-weight:600;color:var(--text-2);margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.history-item{background:rgba(255,255,255,0.4);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:8px;border-left:3px solid var(--lav-300);}
.history-date{font-size:12px;color:var(--text-3);margin-bottom:4px;font-weight:600;}
.history-content{font-size:13px;color:var(--text-1);line-height:1.6;}
.filter-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.filter-chip{padding:6px 14px;border-radius:16px;background:rgba(255,255,255,0.5);border:1px solid rgba(184,169,217,0.25);font-size:12px;color:var(--text-2);cursor:pointer;transition:all 0.2s ease;}
.filter-chip.active{background:linear-gradient(135deg,var(--lav-300),var(--lav-400));color:var(--white);border-color:var(--lav-400);}
.toast{position:fixed;bottom:calc(30px + var(--safe-bottom));left:50%;transform:translateX(-50%) translateY(100px);background:rgba(74,64,107,0.92);backdrop-filter:blur(10px);color:#fff;padding:12px 24px;border-radius:24px;font-size:13px;font-weight:500;z-index:9999;opacity:0;transition:all 0.3s ease;pointer-events:none;box-shadow:0 4px 20px rgba(74,64,107,0.3);}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
.modal-overlay{position:fixed;inset:0;background:rgba(74,64,107,0.4);backdrop-filter:blur(4px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.show{display:flex;}
.modal{background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);border-radius:var(--radius-xl);padding:24px;width:100%;max-width:380px;max-height:80vh;overflow-y:auto;box-shadow:0 10px 40px rgba(74,64,107,0.25);}
.modal-title{font-size:18px;font-weight:700;color:var(--text-1);margin-bottom:16px;text-align:center;}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted);}
.empty-state-icon{font-size:40px;margin-bottom:12px;opacity:0.5;}
.empty-state-text{font-size:13px;}
.emoji,img.emoji{display:inline-block !important;width:1.1em !important;height:1.1em !important;vertical-align:-0.15em;margin:0 0.05em;max-width:none !important;max-height:none !important;}
@media (max-width:768px){:root{--sidebar-w:0px;}.app{flex-direction:column;}.sidebar{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;flex-direction:row;padding:8px 4px calc(8px + var(--safe-bottom));border-right:none;border-top:1px solid var(--glass-border);background:rgba(255,255,255,0.75);backdrop-filter:blur(20px);z-index:200;overflow-x:auto;overflow-y:hidden;}.sidebar-header,.sidebar-footer{display:none;}.nav-list{display:flex;flex-direction:row;padding:0;gap:2px;}.nav-item{flex-direction:column;min-width:62px;padding:6px 4px;margin:0 2px;}.nav-item.active::before{display:none;}.nav-icon{font-size:18px;}.nav-label{font-size:9px;}.nav-item.active{box-shadow:none;background:rgba(184,169,217,0.25);}.main{padding:calc(var(--safe-top) + 16px) 16px 100px;}.page-title{font-size:21px;}.dash-hello{font-size:22px;}.dash-grid{grid-template-columns:1fr;}.stat-row{grid-template-columns:repeat(3,1fr);}.countdown-value{font-size:42px;}.stat-value{font-size:24px;}}
@media (max-width:380px){.nav-item{min-width:54px;padding:6px 2px;}.nav-icon{font-size:16px;}.nav-label{font-size:8px;}}
</style>
</head>
<body>
<div class="stars-bg" id="starsBg"></div>
<svg class="moon-deco" viewBox="0 0 40 40"><path d="M28 20a12 12 0 1 1-12-12 9 9 0 0 0 12 12z" fill="#E8D9A0" opacity="0.6"/></svg>
<div class="galaxy-deco"></div>
<div class="app">
<nav class="sidebar" id="sidebar"><div class="sidebar-header"><div class="sidebar-logo">🌌</div><div class="sidebar-title">做宇宙的<br>主人</div></div><ul class="nav-list" id="navList"></ul><div class="sidebar-footer"><div class="sidebar-quote">一点一点<br>成为更好的自己</div></div></nav>
<main class="main" id="main"></main>
</div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalContent"></div></div>
<script src="app.js"></script>
</body>
</html>
